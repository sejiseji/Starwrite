<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Starwrite Sky Prototype</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #05060d;
        color: #f5f7ff;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        overflow: hidden;
        overscroll-behavior: none;
      }

      body {
        display: grid;
        place-items: center;
        min-height: 100dvh;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
        box-sizing: border-box;
      }

      .startup-gate {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 50% 35%, #151b35 0, #070914 48%, #03040a 100%);
        opacity: 1;
        transition: opacity 160ms ease;
        z-index: 2147483646;
      }

      .startup-gate.is-hidden {
        opacity: 0;
        pointer-events: none;
      }

      .startup-start-text {
        color: #f5f7ff;
        font-size: 20px;
        font-weight: 800;
        letter-spacing: 0;
        text-align: center;
        user-select: none;
        -webkit-user-select: none;
      }

      .startup-loader {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 50% 35%, #151b35 0, #070914 48%, #03040a 100%);
        opacity: 0;
        pointer-events: none;
        transition: opacity 180ms ease;
        z-index: 2147483647;
      }

      .startup-loader.is-visible {
        opacity: 1;
        pointer-events: auto;
      }

      .startup-scene {
        position: relative;
        width: 180px;
        height: 150px;
        image-rendering: pixelated;
        transform: translate3d(0, 0, 0);
        -webkit-transform: translate3d(0, 0, 0);
      }

      .startup-stars,
      .startup-stars::before,
      .startup-stars::after {
        position: absolute;
        content: "";
        width: 4px;
        height: 4px;
        background: #f5f7ff;
        box-shadow:
          36px 18px 0 #6ed6ff,
          74px 4px 0 #ffe39a,
          132px 26px 0 #f5f7ff,
          158px 7px 0 #f58f8f,
          24px 92px 0 #f5f7ff,
          148px 94px 0 #6ed6ff;
        animation: startup-twinkle 1.2s steps(2, end) infinite;
        -webkit-animation: startup-twinkle 1.2s steps(2, end) infinite;
      }

      .startup-stars::before {
        left: 18px;
        top: 34px;
        opacity: 0.65;
        animation-delay: 0.35s;
      }

      .startup-stars::after {
        left: 42px;
        top: 12px;
        opacity: 0.85;
        animation-delay: 0.7s;
      }

      .startup-ground {
        position: absolute;
        left: 22px;
        right: 12px;
        bottom: 18px;
        height: 5px;
        background: #34405c;
        box-shadow: 0 5px 0 #151b2e;
      }

      .telescope {
        position: absolute;
        left: 74px;
        top: 69px;
        width: 62px;
        height: 20px;
        transform-origin: 10px 16px;
        transform: rotate(-12deg);
        animation: startup-scan 1.4s steps(4, end) infinite;
        -webkit-animation: startup-scan 1.4s steps(4, end) infinite;
        will-change: transform;
      }

      .telescope::before {
        position: absolute;
        content: "";
        left: 8px;
        top: 5px;
        width: 44px;
        height: 10px;
        background: #9aa7c8;
        box-shadow:
          4px 4px 0 #566480,
          44px -2px 0 #d6def5,
          48px 2px 0 #7382a2;
      }

      .telescope::after {
        position: absolute;
        content: "";
        left: 20px;
        top: 17px;
        width: 6px;
        height: 30px;
        background: #657390;
        transform: rotate(14deg);
        box-shadow: 18px -2px 0 #657390;
      }

      .cube-kid {
        position: absolute;
        left: 42px;
        top: 66px;
        width: 34px;
        height: 34px;
        background: #66d9c8;
        box-shadow:
          inset -6px -6px 0 #2f9c91,
          0 -8px 0 #20283e,
          0 34px 0 #46516f,
          7px 44px 0 #20283e,
          21px 44px 0 #20283e;
        animation: startup-peek 0.9s steps(3, end) infinite;
        -webkit-animation: startup-peek 0.9s steps(3, end) infinite;
        will-change: transform;
      }

      .cube-kid::before {
        position: absolute;
        content: "";
        left: 8px;
        top: 12px;
        width: 5px;
        height: 5px;
        background: #071019;
        box-shadow:
          13px 0 0 #071019,
          6px 10px 0 #fff0bd,
          10px 10px 0 #fff0bd;
        animation: startup-blink 1.8s steps(1, end) infinite;
        -webkit-animation: startup-blink 1.8s steps(1, end) infinite;
      }

      .cube-kid::after {
        position: absolute;
        content: "";
        left: 29px;
        top: 19px;
        width: 24px;
        height: 6px;
        background: #66d9c8;
        box-shadow: 0 6px 0 #2f9c91;
        transform: rotate(-10deg);
      }

      .startup-label {
        position: absolute;
        left: 0;
        right: 0;
        bottom: -2px;
        color: #dbe7ff;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0;
        text-align: center;
      }

      @keyframes startup-twinkle {
        0%,
        100% {
          opacity: 0.6;
        }
        50% {
          opacity: 1;
        }
      }

      @-webkit-keyframes startup-twinkle {
        0%,
        100% {
          opacity: 0.6;
        }
        50% {
          opacity: 1;
        }
      }

      @keyframes startup-scan {
        0%,
        100% {
          transform: rotate(-17deg);
        }
        50% {
          transform: rotate(-2deg);
        }
      }

      @keyframes startup-peek {
        0%,
        100% {
          transform: translate3d(0, 0, 0);
        }
        33% {
          transform: translate3d(0, -5px, 0);
        }
        66% {
          transform: translate3d(0, 3px, 0);
        }
      }

      @keyframes startup-blink {
        0%,
        88%,
        100% {
          height: 5px;
          top: 12px;
        }
        92% {
          height: 2px;
          top: 14px;
        }
      }

      @-webkit-keyframes startup-scan {
        0%,
        100% {
          -webkit-transform: rotate(-17deg);
          transform: rotate(-17deg);
        }
        50% {
          -webkit-transform: rotate(-2deg);
          transform: rotate(-2deg);
        }
      }

      @-webkit-keyframes startup-peek {
        0%,
        100% {
          -webkit-transform: translate3d(0, 0, 0);
          transform: translate3d(0, 0, 0);
        }
        33% {
          -webkit-transform: translate3d(0, -5px, 0);
          transform: translate3d(0, -5px, 0);
        }
        66% {
          -webkit-transform: translate3d(0, 3px, 0);
          transform: translate3d(0, 3px, 0);
        }
      }

      @-webkit-keyframes startup-blink {
        0%,
        88%,
        100% {
          height: 5px;
          top: 12px;
        }
        92% {
          height: 2px;
          top: 14px;
        }
      }

      pyxel-run {
        display: block;
        width: min(100vw, calc(100dvh * 396 / 696), 430px);
        height: min(100dvh, calc(100vw * 696 / 396), 696px);
        aspect-ratio: 396 / 696;
        touch-action: none;
      }

      pyxel-run canvas {
        width: 100% !important;
        height: 100% !important;
        image-rendering: pixelated;
      }

      @media (orientation: portrait) and (max-width: 500px) {
        body {
          padding: 0;
        }

        pyxel-run {
          width: 100vw;
          height: 100dvh;
          aspect-ratio: 396 / 696;
        }
      }
    </style>
    <script src="https://cdn.jsdelivr.net/gh/kitao/pyxel/wasm/pyxel.js"></script>
  </head>
  <body>
    <div id="startup-gate" class="startup-gate" aria-hidden="false">
      <div class="startup-start-text">TOUCH TO START</div>
    </div>
    <div id="startup-loader" class="startup-loader" aria-hidden="true">
      <div class="startup-scene" role="img" aria-label="Loading star sky">
        <div class="startup-stars"></div>
        <div class="startup-ground"></div>
        <div class="telescope"></div>
        <div class="cube-kid"></div>
        <div class="startup-label">LOADING SKY</div>
      </div>
    </div>
    <pyxel-run root="." name="src/app_pyxres_sounds.py"></pyxel-run>
    <script>
      const startupGate = document.getElementById("startup-gate");
      const startupLoader = document.getElementById("startup-loader");
      const pyxelRun = document.querySelector("pyxel-run");
      const minimumStartupMs = 1200;
      const startupForwardDelayMs = 720;
      let startupShownAt = 0;
      let startupHideTimer = 0;
      let startupReleaseTimer = 0;
      let startupInteractionSeen = false;
      let startupReady = false;
      let startupDismissed = false;
      const startupEvents = ["pointerdown", "mousedown", "click", "touchstart", "touchend", "keydown"];
      const startupHookedTargets = new WeakSet();
      let startupStartReleased = false;

      function captureStartupEvent(event) {
        if (!event || startupDismissed) {
          return;
        }
        if (event.cancelable) {
          event.preventDefault();
        }
        event.stopPropagation();
        if (typeof event.stopImmediatePropagation === "function") {
          event.stopImmediatePropagation();
        }
      }

      function releasePyxelStartWhenReady() {
        if (startupStartReleased) {
          return;
        }
        const resolveInput = window.pyxelContext?.resolveInput;
        if (typeof resolveInput === "function") {
          startupStartReleased = true;
          resolveInput();
          return;
        }
        startupReleaseTimer = window.setTimeout(releasePyxelStartWhenReady, 50);
      }

      function schedulePyxelStartRelease() {
        const elapsed = startupShownAt ? performance.now() - startupShownAt : 0;
        const delay = Math.max(0, startupForwardDelayMs - elapsed);
        window.clearTimeout(startupReleaseTimer);
        window.requestAnimationFrame(() => {
          window.requestAnimationFrame(() => {
            startupReleaseTimer = window.setTimeout(releasePyxelStartWhenReady, delay);
          });
        });
      }

      function scheduleStartupHide() {
        if (startupShownAt === 0) {
          return;
        }
        const elapsed = performance.now() - startupShownAt;
        const remaining = Math.max(0, minimumStartupMs - elapsed);
        window.clearTimeout(startupHideTimer);
        startupHideTimer = window.setTimeout(() => {
          startupLoader.classList.remove("is-visible");
          startupLoader.setAttribute("aria-hidden", "true");
          startupDismissed = true;
        }, remaining);
      }

      function showStartupLoader(_event, force = false) {
        if (!force) {
          captureStartupEvent(_event);
        }
        if (startupDismissed || (startupInteractionSeen && !force)) {
          return;
        }
        startupInteractionSeen = true;
        window.clearTimeout(startupHideTimer);
        if (startupShownAt === 0) {
          startupShownAt = performance.now();
        }
        startupGate.classList.add("is-hidden");
        startupGate.setAttribute("aria-hidden", "true");
        startupLoader.classList.add("is-visible");
        startupLoader.setAttribute("aria-hidden", "false");
        if (!force) {
          schedulePyxelStartRelease();
        }
        if (startupReady || document.body.dataset.starwriteReady === "1") {
          scheduleStartupHide();
        }
      }

      function hideStartupLoader() {
        startupReady = true;
        if (!startupInteractionSeen) {
          showStartupLoader(null, true);
        }
        scheduleStartupHide();
      }

      function attachStartupListener(target) {
        if (!target || startupHookedTargets.has(target)) {
          return;
        }
        try {
          startupHookedTargets.add(target);
          for (const eventName of startupEvents) {
            const options = eventName.startsWith("touch")
              ? { capture: true, passive: false }
              : { capture: true };
            target.addEventListener(eventName, showStartupLoader, options);
          }
        } catch (_error) {
          return;
        }
      }

      function attachDeepStartupListeners() {
        attachStartupListener(window);
        attachStartupListener(document);
        attachStartupListener(document.documentElement);
        attachStartupListener(document.body);
        attachStartupListener(startupGate);
        attachStartupListener(startupLoader);
        attachStartupListener(pyxelRun);
        for (const target of document.querySelectorAll("pyxel-run, canvas, button, div")) {
          attachStartupListener(target);
        }
        if (pyxelRun.shadowRoot) {
          attachStartupListener(pyxelRun.shadowRoot);
          for (const target of pyxelRun.shadowRoot.querySelectorAll("*")) {
            attachStartupListener(target);
          }
        }
      }

      attachDeepStartupListeners();
      window.setTimeout(attachDeepStartupListeners, 250);
      window.setTimeout(attachDeepStartupListeners, 1000);
      new MutationObserver(attachDeepStartupListeners).observe(document.body, {
        childList: true,
        subtree: true,
      });
      window.addEventListener("blur", () => showStartupLoader(null, true));
      window.addEventListener("starwrite-loading", () => showStartupLoader(null, true));
      window.addEventListener("starwrite-ready", hideStartupLoader);

      new MutationObserver(() => {
        if (document.body.dataset.starwriteReady === "1") {
          hideStartupLoader();
        }
      }).observe(document.body, { attributes: true, attributeFilter: ["data-starwrite-ready"] });

      window.starwritePinchDelta = 0;
      let starwriteLastPinchDistance = 0;

      function starwriteTouchDistance(event) {
        if (!event.touches || event.touches.length < 2) {
          return 0;
        }
        const a = event.touches[0];
        const b = event.touches[1];
        return Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
      }

      function starwriteHandlePinchStart(event) {
        if (!event.touches || event.touches.length < 2) {
          starwriteLastPinchDistance = 0;
          return;
        }
        starwriteLastPinchDistance = starwriteTouchDistance(event);
        if (event.cancelable) {
          event.preventDefault();
        }
      }

      function starwriteHandlePinchMove(event) {
        if (!event.touches || event.touches.length < 2) {
          starwriteLastPinchDistance = 0;
          return;
        }
        const distance = starwriteTouchDistance(event);
        if (starwriteLastPinchDistance > 0) {
          window.starwritePinchDelta += distance - starwriteLastPinchDistance;
        }
        starwriteLastPinchDistance = distance;
        if (event.cancelable) {
          event.preventDefault();
        }
      }

      function starwriteHandlePinchEnd(event) {
        if (!event.touches || event.touches.length < 2) {
          starwriteLastPinchDistance = 0;
        }
      }

      document.addEventListener("touchstart", starwriteHandlePinchStart, { passive: false });
      document.addEventListener("touchmove", starwriteHandlePinchMove, { passive: false });
      document.addEventListener("touchend", starwriteHandlePinchEnd, { passive: true });
      document.addEventListener("touchcancel", starwriteHandlePinchEnd, { passive: true });
    </script>
  </body>
</html>
