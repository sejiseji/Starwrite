<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Starwrite Sky Prototype</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #05060d;
        color: #f5f7ff;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        overflow: hidden;
        overscroll-behavior: none;
      }

      body {
        display: grid;
        place-items: center;
        min-height: 100dvh;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
        box-sizing: border-box;
      }

      pyxel-run {
        display: block;
        width: min(100vw, calc(100dvh * 396 / 696), 430px);
        height: min(100dvh, calc(100vw * 696 / 396), 696px);
        aspect-ratio: 396 / 696;
        touch-action: none;
      }

      pyxel-run canvas {
        width: 100% !important;
        height: 100% !important;
        image-rendering: pixelated;
      }

      @media (orientation: portrait) and (max-width: 500px) {
        body {
          padding: 0;
        }

        pyxel-run {
          width: 100vw;
          height: 100dvh;
          aspect-ratio: 396 / 696;
        }
      }
    </style>
    <script>
      (() => {
        const token = Date.now().toString(36);
        const shouldBust = (url) =>
          url.origin === window.location.origin && /\.(py|pyxres)$/i.test(url.pathname);
        const bustUrl = (value) => {
          try {
            const url = new URL(value, window.location.href);
            if (shouldBust(url)) {
              url.searchParams.set("starwrite_bust", token);
              return url.toString();
            }
          } catch (_error) {
            return value;
          }
          return value;
        };
        const originalFetch = window.fetch.bind(window);
        window.fetch = (input, init = {}) => {
          if (input instanceof Request) {
            const busted = bustUrl(input.url);
            if (busted !== input.url) {
              const requestInit = {
                method: input.method,
                headers: input.headers,
                mode: input.mode,
                credentials: input.credentials,
                cache: "reload",
                redirect: input.redirect,
                referrer: input.referrer,
                integrity: input.integrity,
              };
              return originalFetch(new Request(busted, requestInit), init);
            }
          }
          return originalFetch(bustUrl(input), { cache: "reload", ...init });
        };
        const originalOpen = XMLHttpRequest.prototype.open;
        XMLHttpRequest.prototype.open = function (method, url, ...rest) {
          return originalOpen.call(this, method, bustUrl(url), ...rest);
        };
        if (window.caches) {
          window.caches
            .keys()
            .then((keys) =>
              Promise.all(
                keys
                  .filter((key) => /pyxel|starwrite/i.test(key))
                  .map((key) => window.caches.delete(key)),
              ),
            )
            .catch(() => {});
        }
      })();
    </script>
    <script src="https://cdn.jsdelivr.net/gh/kitao/pyxel/wasm/pyxel.js"></script>
  </head>
  <body>
    <pyxel-run root="." name="src/app_pyxres_sounds.py"></pyxel-run>
    <script>
      window.starwritePinchDelta = 0;
      let starwriteLastPinchDistance = 0;

      function starwriteTouchDistance(event) {
        if (!event.touches || event.touches.length < 2) {
          return 0;
        }
        const a = event.touches[0];
        const b = event.touches[1];
        return Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
      }

      function starwriteHandlePinchStart(event) {
        if (!event.touches || event.touches.length < 2) {
          starwriteLastPinchDistance = 0;
          return;
        }
        starwriteLastPinchDistance = starwriteTouchDistance(event);
        if (event.cancelable) {
          event.preventDefault();
        }
      }

      function starwriteHandlePinchMove(event) {
        if (!event.touches || event.touches.length < 2) {
          starwriteLastPinchDistance = 0;
          return;
        }
        const distance = starwriteTouchDistance(event);
        if (starwriteLastPinchDistance > 0) {
          window.starwritePinchDelta += distance - starwriteLastPinchDistance;
        }
        starwriteLastPinchDistance = distance;
        if (event.cancelable) {
          event.preventDefault();
        }
      }

      function starwriteHandlePinchEnd(event) {
        if (!event.touches || event.touches.length < 2) {
          starwriteLastPinchDistance = 0;
        }
      }

      document.addEventListener("touchstart", starwriteHandlePinchStart, { passive: false });
      document.addEventListener("touchmove", starwriteHandlePinchMove, { passive: false });
      document.addEventListener("touchend", starwriteHandlePinchEnd, { passive: true });
      document.addEventListener("touchcancel", starwriteHandlePinchEnd, { passive: true });
    </script>
  </body>
</html>
