<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Starwrite Sky Prototype</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #05060d;
        color: #f5f7ff;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        overflow: hidden;
        overscroll-behavior: none;
      }

      body {
        display: grid;
        place-items: center;
        min-height: 100dvh;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
        box-sizing: border-box;
      }

      .startup-loader {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 50% 35%, #151b35 0, #070914 48%, #03040a 100%);
        opacity: 1;
        pointer-events: auto;
        transition:
          opacity 280ms ease,
          background 280ms ease;
        z-index: 2147483647;
      }

      .startup-loader.is-loading {
        background: #000;
      }

      .startup-loader.is-dismissed {
        opacity: 0;
        pointer-events: none;
      }

      .startup-start {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: #f5f7ff;
        font-size: 20px;
        font-weight: 800;
        letter-spacing: 0;
        text-align: center;
        transition: opacity 180ms ease;
      }

      .startup-scene {
        position: relative;
        width: 180px;
        height: 150px;
        image-rendering: pixelated;
        opacity: 0;
        transform: translateY(8px);
        transition:
          opacity 420ms ease 160ms,
          transform 420ms ease 160ms;
      }

      .startup-loader.is-loading .startup-start {
        opacity: 0;
      }

      .startup-loader.is-loading .startup-scene {
        opacity: 1;
        transform: translateY(0);
      }

      .startup-stars,
      .startup-stars::before,
      .startup-stars::after {
        position: absolute;
        content: "";
        width: 4px;
        height: 4px;
        background: #f5f7ff;
        box-shadow:
          36px 18px 0 #6ed6ff,
          74px 4px 0 #ffe39a,
          132px 26px 0 #f5f7ff,
          158px 7px 0 #f58f8f,
          24px 92px 0 #f5f7ff,
          148px 94px 0 #6ed6ff;
        animation: startup-twinkle 1.2s steps(2, end) infinite;
      }

      .startup-stars::before {
        left: 18px;
        top: 34px;
        opacity: 0.65;
        animation-delay: 0.35s;
      }

      .startup-stars::after {
        left: 42px;
        top: 12px;
        opacity: 0.85;
        animation-delay: 0.7s;
      }

      .startup-ground {
        position: absolute;
        left: 22px;
        right: 12px;
        bottom: 18px;
        height: 5px;
        background: #34405c;
        box-shadow: 0 5px 0 #151b2e;
      }

      .telescope {
        position: absolute;
        left: 74px;
        top: 69px;
        width: 62px;
        height: 20px;
        transform-origin: 10px 16px;
        transform: rotate(-12deg);
        animation: startup-scan 1.6s steps(4, end) infinite;
      }

      .telescope::before {
        position: absolute;
        content: "";
        left: 8px;
        top: 5px;
        width: 44px;
        height: 10px;
        background: #9aa7c8;
        box-shadow:
          4px 4px 0 #566480,
          44px -2px 0 #d6def5,
          48px 2px 0 #7382a2;
      }

      .telescope::after {
        position: absolute;
        content: "";
        left: 20px;
        top: 17px;
        width: 6px;
        height: 30px;
        background: #657390;
        transform: rotate(14deg);
        box-shadow: 18px -2px 0 #657390;
      }

      .cube-kid {
        position: absolute;
        left: 42px;
        top: 66px;
        width: 34px;
        height: 34px;
        background: #66d9c8;
        box-shadow:
          inset -6px -6px 0 #2f9c91,
          0 -8px 0 #20283e,
          0 34px 0 #46516f,
          7px 44px 0 #20283e,
          21px 44px 0 #20283e;
        animation: startup-peek 0.8s steps(2, end) infinite;
      }

      .cube-kid::before {
        position: absolute;
        content: "";
        left: 8px;
        top: 12px;
        width: 5px;
        height: 5px;
        background: #071019;
        box-shadow:
          13px 0 0 #071019,
          6px 10px 0 #fff0bd,
          10px 10px 0 #fff0bd;
      }

      .cube-kid::after {
        position: absolute;
        content: "";
        left: 29px;
        top: 19px;
        width: 24px;
        height: 6px;
        background: #66d9c8;
        box-shadow: 0 6px 0 #2f9c91;
        transform: rotate(-10deg);
      }

      .startup-label {
        position: absolute;
        left: 0;
        right: 0;
        bottom: -2px;
        color: #dbe7ff;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0;
        text-align: center;
      }

      @keyframes startup-twinkle {
        0%,
        100% {
          opacity: 0.6;
        }
        50% {
          opacity: 1;
        }
      }

      @keyframes startup-scan {
        0%,
        100% {
          transform: rotate(-14deg);
        }
        50% {
          transform: rotate(-5deg);
        }
      }

      @keyframes startup-peek {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(2px);
        }
      }

      pyxel-run {
        display: block;
        width: min(100vw, 960px);
        max-height: 100dvh;
        aspect-ratio: 4 / 3;
        touch-action: none;
      }

      body:not([data-starwrite-ready="1"]) #pyxel-screen {
        opacity: 0;
      }

      body[data-starwrite-ready="1"] #pyxel-screen {
        opacity: 1;
        transition: opacity 240ms ease;
      }

      pyxel-run canvas {
        width: 100% !important;
        height: 100% !important;
        image-rendering: pixelated;
      }

      @media (orientation: portrait) and (max-width: 500px) {
        body {
          padding: 0;
        }

        pyxel-run {
          width: 100vw;
          height: 100dvh;
          aspect-ratio: 392 / 696;
        }
      }
    </style>
    <script src="https://cdn.jsdelivr.net/gh/kitao/pyxel/wasm/pyxel.js"></script>
  </head>
  <body>
    <div id="startup-loader" class="startup-loader" role="button" tabindex="0" aria-hidden="false">
      <div class="startup-start">TOUCH TO START</div>
      <div class="startup-scene" role="img" aria-label="Loading star sky">
        <div class="startup-stars"></div>
        <div class="startup-ground"></div>
        <div class="telescope"></div>
        <div class="cube-kid"></div>
        <div class="startup-label">LOADING SKY</div>
      </div>
    </div>
    <pyxel-run root="." name="src/app_v2.py"></pyxel-run>
    <script>
      const startupLoader = document.getElementById("startup-loader");
      const minimumStartupMs = 1500;
      let startupShownAt = 0;
      let startupHideTimer = 0;
      let startupReady = false;
      let startupStarted = false;
      let startupDismissed = false;
      let startupReleaseAttempts = 0;

      function scheduleStartupHide() {
        if (!startupStarted || startupShownAt === 0) {
          return;
        }
        const elapsed = performance.now() - startupShownAt;
        const remaining = Math.max(0, minimumStartupMs - elapsed);
        window.clearTimeout(startupHideTimer);
        startupHideTimer = window.setTimeout(() => {
          document.body.dataset.starwriteReady = "1";
          startupLoader.classList.add("is-dismissed");
          startupLoader.setAttribute("aria-hidden", "true");
          startupDismissed = true;
        }, remaining);
      }

      function releasePyxelStart() {
        if (startupReady || startupDismissed || startupReleaseAttempts > 300) {
          return;
        }
        startupReleaseAttempts += 1;
        if (window.pyxelContext?.resolveInput) {
          window.pyxelContext.resolveInput();
          return;
        }
        document.body.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true }));
        window.setTimeout(releasePyxelStart, 80);
      }

      function startLoading() {
        if (startupStarted || startupDismissed) {
          return;
        }
        startupStarted = true;
        startupShownAt = performance.now();
        document.body.dataset.starwriteStarted = "1";
        startupLoader.classList.add("is-loading");
        startupLoader.setAttribute("aria-busy", "true");
        releasePyxelStart();
        if (startupReady) {
          scheduleStartupHide();
        }
      }

      function markReady() {
        startupReady = true;
        if (startupStarted) {
          scheduleStartupHide();
        }
      }

      startupLoader.addEventListener("click", startLoading);
      startupLoader.addEventListener("touchstart", startLoading, { passive: true });
      startupLoader.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          startLoading();
        }
      });
      window.addEventListener("starwrite-loading", startLoading);
      window.addEventListener("starwrite-ready", markReady);
    </script>
  </body>
</html>
