<!doctype html>
<!-- Local diagnostic only: uses real bundled Pyxel WASM, but deliberately
     simulates lifecycle event loss. It does NOT reproduce physical iPhone
     Control Center or establish what sequence iOS/Edge actually emits. --><html><head><meta charset="utf-8"><base href="/"><title>Starwrite foreground recovery probe</title>
<link rel="stylesheet" href="/assets/starwrite.css"><script src="/assets/vendor/pyxel/pyxel.js"></script><script src="/assets/starwrite_input.js?v=foreground-input-recovery-1"></script>
<style>#qa-panel{position:fixed;z-index:2000;top:0;left:0;background:white;color:black;padding:8px;max-width:42vw;font:14px monospace;}#qa-result{white-space:pre-wrap;}</style></head><body>
<pyxel-run root="." name="tests/fixtures/touch_input_probe.py"></pyxel-run>
<div id="qa-panel"><button id="qa-suite">Run foreground recovery suite</button><button id="qa-hidden">Run missing visible-event sequence</button><button id="qa-focus">Run blur without focus sequence</button><button id="qa-run">Run dropped-touch sequence</button><pre id="qa-result">Start Pyxel, then run the test.</pre></div>
<script>
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const result=document.getElementById('qa-result');
function state(){return {frame:window.starwriteProbeFrame,presses:window.starwriteProbePresses,down:window.starwriteProbeDown,cancelSequence:window.starwriteInputCancelSequence,pinch:window.starwritePinchActive};}
function finger(canvas,id){const r=canvas.getBoundingClientRect();const x=r.left+r.width/2,y=r.top+r.height/2;return new Touch({identifier:id,target:canvas,clientX:x,clientY:y,pageX:x,pageY:y,screenX:x,screenY:y,radiusX:1,radiusY:1,force:1});}
function emit(canvas,type,touches,changed){canvas.dispatchEvent(new TouchEvent(type,{bubbles:true,cancelable:true,touches,targetTouches:touches,changedTouches:changed}));}
document.getElementById('qa-run').onclick=async()=>{
 try{
  const canvas=document.getElementById('canvas');
  if(!Number.isFinite(window.starwriteProbeFrame))throw new Error('Start Pyxel before running');
  let report={before:state()}; const a=finger(canvas,101),b=finger(canvas,102),c=finger(canvas,103);
  emit(canvas,'touchstart',[a],[a]); await wait(150); report.firstDown=state();
  // Deliberately omit A's end. A no longer exists in the browser's active list.
  emit(canvas,'touchstart',[b],[b]); await wait(150); report.nextDown=state();
  emit(canvas,'touchend',[],[b]); await wait(250); report.nextUp=state();
  emit(canvas,'touchstart',[c],[c]); await wait(150); report.thirdDown=state();
  emit(canvas,'touchend',[],[c]); await wait(250); report.thirdUp=state();
  // Cleanup the intentionally stranded ID so the test is repeatable.
  emit(canvas,'touchcancel',[],[a]); await wait(250); report.cleanup=state();
  report.recovered=report.nextDown.presses>report.firstDown.presses&&!report.nextUp.down;
  result.textContent=JSON.stringify(report,null,2);
 }catch(error){result.textContent=String(error.stack||error);}
};
document.getElementById("qa-focus").onclick=async()=>{
 try{
  const canvas=document.getElementById("canvas");
  if(!Number.isFinite(window.starwriteProbeFrame))throw new Error("Start Pyxel before running");
  const a=finger(canvas,201),b=finger(canvas,202);
  const report={before:state()};
  window.dispatchEvent(new Event("blur")); await wait(250); report.blurred=state();
  emit(canvas,"touchstart",[a],[a]); await wait(150); report.tapDown=state();
  emit(canvas,"touchend",[],[a]); await wait(250); report.tapUp=state();
  window.dispatchEvent(new Event("focus")); await wait(250); report.focused=state();
  emit(canvas,"touchstart",[b],[b]); await wait(150); report.recoveryDown=state();
  emit(canvas,"touchend",[],[b]); await wait(250); report.recoveryUp=state();
  result.textContent=JSON.stringify(report,null,2);
 }catch(error){result.textContent=String(error.stack||error);}
};
document.getElementById("qa-hidden").onclick=async()=>{
 const report={before:state()};
 const hidden=Object.getOwnPropertyDescriptor(document,"hidden");
 const visibility=Object.getOwnPropertyDescriptor(document,"visibilityState");
 try{
  const canvas=document.getElementById("canvas");
  if(!Number.isFinite(window.starwriteProbeFrame))throw new Error("Start Pyxel before running");
  const a=finger(canvas,301),b=finger(canvas,302);
  Object.defineProperty(document,"hidden",{configurable:true,value:true});
  Object.defineProperty(document,"visibilityState",{configurable:true,value:"hidden"});
  document.dispatchEvent(new Event("visibilitychange")); await wait(250); report.hidden=state();
  Object.defineProperty(document,"hidden",{configurable:true,value:false});
  Object.defineProperty(document,"visibilityState",{configurable:true,value:"visible"});
  // Intentionally omit the return visibilitychange, but deliver window focus.
  window.dispatchEvent(new Event("focus")); await wait(250); report.focused=state();
  emit(canvas,"touchstart",[a],[a]); await wait(150); report.tapDown=state();
  emit(canvas,"touchend",[],[a]); await wait(250); report.tapUp=state();
  document.dispatchEvent(new Event("visibilitychange")); await wait(250); report.visible=state();
  emit(canvas,"touchstart",[b],[b]); await wait(150); report.recoveryDown=state();
  emit(canvas,"touchend",[],[b]); await wait(250); report.recoveryUp=state();
  result.textContent=JSON.stringify(report,null,2);
 }catch(error){result.textContent=String(error.stack||error);}
 finally{
  if(hidden)Object.defineProperty(document,"hidden",hidden);else delete document.hidden;
  if(visibility)Object.defineProperty(document,"visibilityState",visibility);else delete document.visibilityState;
  document.dispatchEvent(new Event("visibilitychange"));
 }
};
document.getElementById("qa-suite").onclick=async()=>{
 const hidden=Object.getOwnPropertyDescriptor(document,"hidden");
 const visibility=Object.getOwnPropertyDescriptor(document,"visibilityState");
 const reports=[];
 const setVisible=visible=>{
  Object.defineProperty(document,"hidden",{configurable:true,value:!visible});
  Object.defineProperty(document,"visibilityState",{configurable:true,value:visible?"visible":"hidden"});
 };
 try{
  const canvas=document.getElementById("canvas");
  if(!Number.isFinite(window.starwriteProbeFrame))throw new Error("Start Pyxel before running");
  for(const [index,mode] of ["focus","pageshow","touchstart","pointerdown","visibilitychange","focus"].entries()){
   const report={mode,before:state()};
   setVisible(false); document.dispatchEvent(new Event("visibilitychange"));
   await wait(120); report.hidden=state();
   setVisible(true);
   if(mode==="focus"||mode==="pageshow")window.dispatchEvent(new Event(mode));
   else if(mode==="visibilitychange")document.dispatchEvent(new Event(mode));
   else if(mode==="pointerdown")canvas.dispatchEvent(new PointerEvent(mode,{bubbles:true}));
   await wait(120); report.restored=state();
   const a=finger(canvas,401+index);
   emit(canvas,"touchstart",[a],[a]); await wait(160); report.tapDown=state();
   emit(canvas,"touchend",[],[a]); await wait(160); report.tapUp=state();
   report.pass=(mode==="touchstart"||report.restored.frame>report.hidden.frame)&&
     report.tapDown.frame>report.hidden.frame&&
     report.tapDown.presses===report.before.presses+1&&report.tapDown.down&&!report.tapUp.down;
   reports.push(report);
  }
  result.textContent=JSON.stringify({simulatedLifecycle:true,passed:reports.every(r=>r.pass),reports},null,2);
 }catch(error){result.textContent=String(error.stack||error);}
 finally{
  if(hidden)Object.defineProperty(document,"hidden",hidden);else delete document.hidden;
  if(visibility)Object.defineProperty(document,"visibilityState",visibility);else delete document.visibilityState;
  document.dispatchEvent(new Event("visibilitychange"));
 }
};
</script></body></html>
